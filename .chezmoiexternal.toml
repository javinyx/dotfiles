    # Heavier CRT than arcade-crt: chromatic aberration, glow and a dot mask.
    # Pinned to a commit and checksummed for the same reasons as cursor_blaze.
    refreshPeriod = "8760h"
    checksum.sha256 = "67e8849c5a1c9c37f14331c53e64be84497668de0b52dd5d46dc77077e84991e"
